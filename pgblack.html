<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página de oferta">
  <title>Novas Receitas</title>

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s) {
      if (f.fbq) return;
      n = f.fbq = function() {
        n.callMethod
          ? n.callMethod.apply(n, arguments)
          : n.queue.push(arguments);
      };

      if (!f._fbq) f._fbq = n;

      n.push = n;
      n.loaded = true;
      n.version = "2.0";
      n.queue = [];

      t = b.createElement(e);
      t.async = true;
      t.src = v;

      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    }(
      window,
      document,
      "script",
      "[connect.facebook.net](https://connect.facebook.net/en_US/fbevents.js)"
    );

    fbq("init", "1737103767533720");
    fbq("track", "PageView");
  </script>

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="[facebook.com](https://www.facebook.com/tr?id=1737103767533720&ev=PageView&noscript=1)"
      alt=""
    >
  </noscript>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2a1f;
      background: #f5f7f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      padding: 48px 32px;
      border-radius: 20px;
      background: #ffffff;
      text-align: center;
      box-shadow: 0 12px 40px rgba(31, 42, 31, 0.12);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.05;
    }

    p {
      max-width: 520px;
      margin: 0 auto 30px;
      color: #526052;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .checkout-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 16px 30px;
      border-radius: 12px;
      background: #247a35;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition:
        background-color 160ms ease,
        transform 160ms ease;
    }

    .checkout-button:hover {
      background: #1b6229;
      transform: translateY(-1px);
    }

    .checkout-button:focus-visible {
      outline: 3px solid #9bd5a6;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Novas Receitas</h1>

    <p>
      Coloque aqui a descrição da sua oferta, os benefícios
      e as informações importantes para seus visitantes.
    </p>

    <!-- Troque LINK_DO_CHECKOUT_AQUI pela URL real do checkout -->
    <a
      id="checkout-button"
      class="checkout-button"
      href="LINK_DO_CHECKOUT_AQUI"
    >
      COMPRAR AGORA
    </a>
  </main>

  <script>
    document
      .getElementById("checkout-button")
      .addEventListener("click", function(event) {
        const checkoutUrl = this.getAttribute("href");

        if (
          !checkoutUrl ||
          checkoutUrl === "LINK_DO_CHECKOUT_AQUI"
        ) {
          event.preventDefault();

          alert(
            "Substitua LINK_DO_CHECKOUT_AQUI pela URL real do checkout."
          );

          return;
        }

        event.preventDefault();

        if (typeof fbq === "function") {
          fbq("track", "InitiateCheckout");
        }

        setTimeout(function() {
          window.location.href = checkoutUrl;
        }, 350);
      });
  </script>
</body>
</html>
